# Secret holding the app's env (created from the repo-root .env by
# `make k8s-deploy`). Never put secret values in this file or in --set.
existingSecret: ara-secrets

backend:
  image:
    repository: ara-backend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  # SSE runs are long-lived. Order on pod termination:
  #   preStop sleep (leave Service endpoints) -> SIGTERM -> uvicorn stops
  #   accepting and waits up to gracefulShutdownSeconds for open streams,
  #   then cancels them -> THEN the lifespan drain runs in-flight research
  #   for up to shutdownDrainSeconds and cancels the rest.
  # (Without the graceful timeout uvicorn waits forever on open SSE streams
  # and the drain never runs.)
  # Invariant (enforced at render time):
  #   preStop + graceful + drain < terminationGracePeriodSeconds
  #   (defaults: 10 + 5 + 100 = 115 < 120).
  terminationGracePeriodSeconds: 120
  preStopSleepSeconds: 10
  gracefulShutdownSeconds: 5
  shutdownDrainSeconds: 100
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    # Don't yank pods out from under active research runs.
    scaleDownStabilizationSeconds: 300

frontend:
  image:
    repository: ara-frontend
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

ingress:
  enabled: true
  className: nginx
  host: ara.localtest.me

# Non-secret, cluster-specific settings. Listed after the Secret in envFrom,
# so these override same-named keys from .env.
config:
  ARA_CORS_ORIGINS: "http://ara.localtest.me:8088"
