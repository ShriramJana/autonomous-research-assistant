{{- $f := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels: { app: {{ .Release.Name }}-frontend }
spec:
  replicas: {{ $f.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-frontend }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-frontend }
    spec:
      containers:
        - name: frontend
          image: "{{ $f.image.repository }}:{{ $f.image.tag }}"
          imagePullPolicy: {{ $f.image.pullPolicy }}
          # No BACKEND_ORIGIN here: Next.js bakes rewrites at build time.
          # The image is built with --build-arg BACKEND_ORIGIN (default
          # http://ara-backend:8000, the backend Service below).
          ports:
            - containerPort: {{ $f.port }}
          readinessProbe:
            httpGet: { path: /, port: {{ $f.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml $f.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  selector: { app: {{ .Release.Name }}-frontend }
  ports:
    - port: {{ $f.port }}
      targetPort: {{ $f.port }}
